<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de películas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div class="page-title">
        <header>
            <h1>Incluye tus películas</h1>
        </header>
    </div>

    <form id="movieForm" novalidate>
        <div class="filters">
            <div>
                <label for="title">Título</label>
                <input type="text" id="title" required>
            </div>
            <div>
                <label for="duration">Duración (mins)</label>
                <input type="number" id="duration" required min="1">
            </div>
            <div>
                <label for="year">Año</label>
                <input type="number" id="year" required min="1900" max="2100">
            </div>
        </div>

        <div>
            <label for="directorSelect">Director</label>
            <select id="directorSelect">
                <option value="">Seleccionar director</option>
            </select>
        </div>

        <div>
            <label for="genreSelect">Géneros (mantén Ctrl + Cmd para varios)</label>
            <select id="genreSelect" multiple size="6"></select>
        </div>

        <p id="formError" class="error" hidden></p>

        <button type="submit" id="submitBtn">Guardar película</button>
    </form>

    <section>
        <h2>Tus películas favoritas</h2>
        <div id="movieList"></div>
    </section>

    <script src="script.js"></script>

</body>
</html>
