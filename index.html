<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de películas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div>
        <header>
            <h1>Películas</h1>
        </header>
    </div>

    <div>
        <div>
            <label>Duración (mins)</label>
            <input type="number" id="duration" required min="1">
        </div>
        <div>
            <label>Año</label>
            <input type="number" id="year" required min="1900" maax="2100">
        </div>
    </div>

    <div>
        <label>Director</label>
        <select id="directorSelect">
            <option value="">Seleccionar director</option>
        </select>
    </div>

    <div>
        <label>Géneros</label>
        <select id="genreSelect"></select>
    </div>

    <div>
        <input type="checkbox" id="isAvailable">
        <label for="isAvailable">Disponible para transmisión</label>
    </div>

    <button type="submit">Guardar película</button>

    <section>
        <h2>Tus películas favoritas</h2>
        <div id="movieList"></div>
    </section>

    <script src="script.js"></script>

</body>
</html>
